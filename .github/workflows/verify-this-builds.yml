name: Build and release distributions

on:
  push:
    branches: [master]
    paths-ignore:
      - README.md
      - scripts/**
      - server/**
      - .*

env:
  CRAZY_AHH_DEPS: >-
    python3-jinja2
    libasound2-dev libpulse-dev libaudio-dev libfribidi-dev libjack-dev
    libsndio-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev
    libxfixes-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libdrm-dev
    libgbm-dev libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev libdbus-1-dev
    libibus-1.0-dev libudev-dev libthai-dev libpipewire-0.3-dev libwayland-dev
    libdecor-0-dev liburing-dev libxinerama-dev

jobs:
  build:
    name: Build for ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
          - os: windows-latest
            name: Win32
          - os: windows-latest
            name: Win64
          - os: ubuntu-latest
            name: HTML5

    env:
      CACHE_BUST: 1
      SCCACHE_GHA_ENABLED: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies (Linux)
        uses: awalsh128/cache-apt-pkgs-action@latest
        if: matrix.os == 'ubuntu-latest'
        with:
          version: 1.1
          packages: ${{ env.CRAZY_AHH_DEPS }}

      - name: Install dependencies (Windows)
        if: matrix.os == 'windows-latest'
        run: py -m pip install jinja2

      - name: Source pasture-raised gluten-free emsdk
        uses: emscripten-core/setup-emsdk@main
        if: matrix.name == 'HTML5'
        with:
          version: latest
          actions-cache-folder: emsdk-cache

      - name: Set up MSVC (${{ matrix.name }})
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.name == 'Win32' && 'x86' || 'x64' }}

      - name: Cache build artifacts
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Cache deps
        uses: actions/cache@v6
        with:
          path: build
          key: ${{ env.CACHE_BUST }}-${{ matrix.name }}-${{ github.ref_name }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            ${{ env.CACHE_BUST }}-${{ matrix.name }}-${{ github.ref_name }}-
            ${{ env.CACHE_BUST }}-${{ matrix.name }}-

      - name: Configure
        shell: bash
        run: |
          [[ "${{ matrix.name == 'HTML5' && '1' || '0' }}" == "1" ]] && \
            source "${{ github.workspace }}/emsdk-cache/emsdk-main/emsdk_env.sh"

          ${{ matrix.name == 'HTML5' && 'emcmake ' || '' }} cmake \
            -G Ninja -S . -B build \
            -D CMAKE_BUILD_TYPE=Release \
            -D CMAKE_C_COMPILER_LAUNCHER=sccache \
            -D CMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -D NUTBLAST_BUILD_TEST=ON

      - name: Build
        run: |
          cmake --build build --target NutBlast-test
