name: Deploy NutBlaster

on:
  workflow_dispatch:
  push:
    tags: [rolling]
    paths:
      - .github/workflows/deploy-nutblaster.yml
      - server/**.rs
      - Cargo.*

concurrency:
  group: deploy-nutblaster
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build
        run: cargo build --release --locked

      - name: Copy binary to the server
        uses: appleboy/scp-action@v1
        with:
          host: nutblast.schwung.us
          username: nutpuncher
          key: ${{ secrets.PUBLIC_INSTANCE_SSH_KEY }}
          source: target/release/nutblaster
          target: /tmp
          strip_components: 2

      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: nutblast.schwung.us
          username: nutpuncher
          key: ${{ secrets.PUBLIC_INSTANCE_SSH_KEY }}
          script: |
            set -e
            systemctl --user stop nutblaster-v1 || :
            cp /tmp/nutblaster nutblaster-v1
            systemctl --user start nutblaster-v1
