name: Release NutBlaster binaries

on:
  workflow_dispatch:
  push:
    branches: [production]
    paths:
      - .github/workflows/release-nutblaster-binaries.yml
      - server/**.rs
      - Cargo.lock

concurrency:
  group: release-nutblaster-binaries
  cancel-in-progress: true

jobs:
  build:
    name: Build for ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    if: ${{ !github.event.repository.fork && github.event_name != 'pull_request' }}

    strategy:
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build
        run: cargo build --release --locked

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.name }}
          path: target/release/nutblaster-v*

  release:
    name: Release binaries
    needs: build

    runs-on: ubuntu-latest
    if: ${{ !github.event.repository.fork && github.event_name != 'pull_request' }}

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: artifacts

      - name: Bump the "rolling" tag
        if: github.ref_name == 'production'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f rolling
          git push origin rolling --force

      - name: Release binaries
        uses: softprops/action-gh-release@v3
        with:
          draft: ${{ github.ref_name != 'production' }}
          tag_name: ${{ github.ref_name == 'production' && 'rolling' || github.ref_name }}
          prerelease: ${{ github.ref_name == 'production' }}
          files: target/release/nutblaster-v*
