name: Release NutBlaster binaries

on:
  workflow_dispatch:
  push:
    tags: [rolling]
    paths:
      - .github/workflows/release-nutblaster-binaries.yml
      - server/**.rs
      - Cargo.*

concurrency:
  group: release-nutblaster-binaries
  cancel-in-progress: true

jobs:
  build:
    name: Build for ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    if: ${{ !github.event.repository.fork && github.event_name != 'pull_request' }}

    strategy:
      matrix:
        include:
          - name: Windows
            os: windows-latest
            exe_suffix: .exe

          - name: Linux
            os: ubuntu-latest
            exe_suffix:

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build
        run: cargo build --release --locked

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.name }}
          path: target/release/nutblaster${{ matrix.exe_suffix }}

  release:
    name: Release binaries
    needs: build

    runs-on: ubuntu-latest
    if: ${{ !github.event.repository.fork && github.event_name != 'pull_request' }}

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: artifacts

      - name: Release binaries
        uses: softprops/action-gh-release@v3
        with:
          draft: ${{ github.ref_name != 'rolling' }}
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ github.ref_name == 'rolling' }}
          files: artifacts/release-*/*
